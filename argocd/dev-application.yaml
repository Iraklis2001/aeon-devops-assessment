apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aeon-api-dev
  namespace: argocd
spec:
  project: default
  source:
    # PLACEHOLDER: replace with the real GitOps repository URL.
    repoURL: https://github.com/example/aeon-devops-assessment.git
    targetRevision: main
    path: gitops/overlays/dev
  destination:
    # PLACEHOLDER: in-cluster for a local kind/k3d demo; use a named EKS cluster in AWS.
    server: https://kubernetes.default.svc
    namespace: aeon-api-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
